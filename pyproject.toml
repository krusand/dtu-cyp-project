[project]
name = "dtu-cyp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krusand", email = "110490348+krusand@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "atom-jepa[rdkit]==0.3.0",
    "descriptastorus==2.8.0",
    "e3nn==0.5.8",
    "hydra-core==1.3.2",
    "lightgbm==4.6.0",
    "pandas>=2.2,<3",
    "rdkit>=2025.3.1",
    "scikit-learn>=1.5,<2",
    "six>=1.17.0",
]

[project.scripts]
dtu-cyp-project = "dtu_cyp_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[project.optional-dependencies]
cpu = [
  "torch==2.6.0",
]
cu124 = [
  "torch==2.6.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
