[project]
name = "dtu-cyp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krusand", email = "110490348+krusand@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "atom-jepa[rdkit]==0.3.0",
    "descriptastorus==2.8.0",
    "e3nn==0.5.8",
    "hydra-core==1.3.2",
    "hydra-optuna-sweeper>=1.3.0",
    "lightgbm==4.6.0",
    "loguru>=0.7.3",
    "pandas>=2.2,<3",
    "rdkit>=2025.3.1",
    "scikit-learn>=1.5,<2",
    "six>=1.17.0",
]

[project.scripts]
dtu-cyp-project = "dtu_cyp_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


[project.optional-dependencies]
cpu = [
  "torch==2.6.0",
]
cu124 = [
  "torch==2.6.0",
]
rocm = [
  "torch==2.9.1+rocm7.2.1",
  "torchaudio==2.9.1+rocm7.2.1",
  "torchvision==0.24.1+rocm7.2.1",
  "rocm-sdk-core==7.2.1",
  "rocm-sdk-devel==7.2.1",
  "rocm-sdk-libraries-custom==7.2.1",
  "rocm==7.2.1",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu124" },
    { extra = "rocm" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl", extra = "rocm" },
]
torchaudio = [
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchaudio-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl", extra = "rocm" },
]
torchvision = [
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torchvision-0.24.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl", extra = "rocm" },
]
rocm-sdk-core = [
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl", extra = "rocm" },
]
rocm-sdk-devel = [
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_devel-7.2.1-py3-none-win_amd64.whl", extra = "rocm" },
]
rocm-sdk-libraries-custom = [
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl", extra = "rocm" },
]
rocm = [
  { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm-7.2.1.tar.gz", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
